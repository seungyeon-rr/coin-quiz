<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="twitter:description" content="경제·금융 상식 OX 퀴즈 서바이벌! 20문제를 1분 안에 풀고 평경코인 부자 되자 🪙">
<style>
  :root{
    --primary:#fbbf24; --primary-soft:rgba(251,191,36,.14);
    --o:#3b82f6; --x:#ef4444; --ok:#22c55e;
    --ink:#f8fafc; --muted:#94a3b8; --line:rgba(255,255,255,.16); --gold:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#0b1220; /* PC 좌우 여백 영역 */
    color:var(--ink);
    display:flex;justify-content:center;align-items:stretch;
  }
  /* 모바일 화면 프레임: PC에서는 가운데 정렬 + 좌우 여백 */
  #app{
    width:100%;max-width:430px;min-height:100vh;
    background:linear-gradient(160deg,#0f172a,#1e3a8a);position:relative;overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,.5);
  }
  .screen{flex:1;display:none;flex-direction:column;padding:28px 24px;}
  .screen.active{display:flex}

  /* 시작 화면 */
  #start{justify-content:center;align-items:center;text-align:center;gap:16px}
  #start .coin{font-size:64px}
  #start h1{font-size:25px;margin:0;line-height:1.45;font-weight:800}
  #start p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
  #start .dept{font-size:30px;font-weight:900;letter-spacing:.5px;
    background:linear-gradient(90deg,#fbbf24,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 12px rgba(251,191,36,.3)}

  /* 개인정보 입력 화면 */
  #info{justify-content:center;overflow-y:auto}
  .card{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);
    border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:15px;
    box-shadow:0 12px 32px rgba(0,0,0,.28)}
  .card .head{text-align:center;margin-bottom:2px}
  .card .head .ic{font-size:32px}
  .card .head h2{margin:8px 0 3px;font-size:20px;font-weight:800}
  .card .head span{font-size:12.5px;color:var(--muted)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12.5px;font-weight:600;color:var(--muted)}
  .field input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);
    background:rgba(255,255,255,.95);color:#0f172a;font-size:15px;transition:border-color .15s,box-shadow .15s}
  .field input::placeholder{color:#94a3b8}
  .field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(251,191,36,.3)}
  .row2{display:flex;gap:10px}
  .row2 .field{flex:1}
  .consent{display:flex;align-items:flex-start;gap:11px;background:var(--primary-soft);
    border-radius:12px;padding:13px 14px;cursor:pointer}
  .consent input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--gold);flex:none}
  .consent .txt{font-size:13px;line-height:1.5}
  .consent .txt b{font-weight:700}
  .consent .txt .sub{display:block;font-size:11px;color:var(--muted);margin-top:4px}

  .btn{
    border:none;border-radius:14px;padding:16px 28px;font-size:18px;font-weight:700;
    cursor:pointer;color:#1e293b;background:var(--gold);transition:transform .1s,filter .1s;
    box-shadow:0 8px 24px rgba(251,191,36,.35);
  }
  .btn:active{transform:scale(.97)}
  #startBtn{font-size:19px;padding:17px 46px;margin-top:4px}
  #infoBtn{margin-top:4px}

  /* 진행 헤더 */
  .topbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:10px;color:var(--muted)}
  #time{color:var(--ink)}
  .timebar-wrap{height:9px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-bottom:26px}
  #timebar{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#fbbf24,#ef4444);border-radius:99px}

  /* 문제 */
  #quiz{justify-content:flex-start}
  .badge{align-self:flex-start;background:rgba(255,255,255,.15);color:#fde68a;
    padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:18px}
  .badge.must{background:var(--gold);color:#1e293b}
  #qtext{font-size:24px;font-weight:700;line-height:1.55;flex:1;display:flex;align-items:center;word-break:keep-all}
  .answers{display:flex;gap:14px;margin-top:auto}
  .ans{position:relative;flex:1;height:120px;border-radius:22px;font-size:48px;font-weight:800;
    border:none;cursor:pointer;color:#fff;transition:transform .1s;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .ans:active{transform:scale(.95)}
  .ans.o{background:var(--o)}
  .ans.x{background:var(--x)}
  .answers.locked .ans{pointer-events:none;opacity:.22;filter:grayscale(.5)}
  /* 정답 여부를 O/X 버튼에 직접 표시 (강조) */
  .ans.correct{opacity:1!important;filter:none!important;background:var(--ok);
    box-shadow:0 0 0 5px rgba(34,197,94,.35),0 0 26px rgba(34,197,94,.6);
    animation:correctPulse .5s ease-out}
  .ans.wrong{opacity:1!important;filter:none!important;background:var(--x);
    box-shadow:0 0 0 5px rgba(239,68,68,.35),0 0 26px rgba(239,68,68,.6);
    animation:wrongShake .45s}
  .ans .mark{position:absolute;top:6px;right:14px;font-size:40px;font-weight:900;
    text-shadow:0 2px 6px rgba(0,0,0,.25);animation:markPop .35s ease-out}
  @keyframes correctPulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1.06)}}
  @keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @keyframes markPop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}

  /* 결과 */
  #result{justify-content:center;align-items:center;text-align:center;gap:14px}
  #result .coin{font-size:60px}
  #result h2{font-size:22px;margin:0;font-weight:800}
  #score{font-size:66px;font-weight:900;color:var(--primary);line-height:1}
  #result p{color:var(--muted);margin:0;font-size:15px;line-height:1.6}
</style>
</head>
<body>
<div id="app">

  <!-- 1. 시작 -->
  <section id="start" class="screen active">
    <div class="coin">🪙</div>
    <h1>웰컴 투 경영과,<br>'평경코인'으로 부자 되자!</h1>
    <div class="dept">미래융합경영과</div>
    <p>경제·금융 상식 OX 퀴즈 서바이벌<br>총 20문제 · 제한시간 1분</p>
    <button id="startBtn" class="btn">시작하기</button>
  </section>

  <!-- 2. 개인정보 동의 -->
  <section id="info" class="screen">
    <div class="card">
      <div class="head">
        <div class="ic">📝</div>
        <h2>개인정보 제공 동의</h2>
        <span>참여 전 아래 정보를 입력해 주세요</span>
      </div>
      <div class="field"><label>성명</label><input id="f-name" type="text" placeholder="이름"></div>
      <div class="field"><label>학교명</label><input id="f-school" type="text" placeholder="학교명"></div>
      <div class="row2">
        <div class="field"><label>학년</label><input id="f-grade" type="text" inputmode="numeric" maxlength="1" placeholder="학년"></div>
        <div class="field"><label>반</label><input id="f-class" type="text" inputmode="numeric" maxlength="2" placeholder="반"></div>
      </div>
      <div class="field"><label>핸드폰번호</label><input id="f-phone" type="tel" inputmode="numeric" placeholder="010-0000-0000"></div>
      <label class="consent">
        <input id="f-consent" type="checkbox">
        <span class="txt"><b>개인정보 수집 및 이용에 동의합니다.</b>
          <span class="sub">위 정보는 신입생 입학 관리에만 활용됩니다. (11월 20일 이후 즉시 파기)</span>
        </span>
      </label>
      <button id="infoBtn" class="btn" style="background:#fbbf24;color:#1e293b">퀴즈 시작하기</button>
    </div>
  </section>

  <!-- 2. 퀴즈 -->
  <section id="quiz" class="screen">
    <div class="topbar">
      <span id="progress">1 / 20</span>
      <span id="time">⏱ 60초</span>
    </div>
    <div class="timebar-wrap"><div id="timebar"></div></div>
    <span id="badge" class="badge">문제</span>
    <div id="qtext"></div>
    <div class="answers" id="answers">
      <button class="ans o" data-v="O">O</button>
      <button class="ans x" data-v="X">X</button>
    </div>
  </section>

  <!-- 3. 결과 -->
  <section id="result" class="screen">
    <div class="coin">🎉</div>
    <h2>퀴즈 종료!</h2>
    <div id="score">0 / 20</div>
    <p id="resultMsg"></p>
    <button id="retryBtn" class="btn" style="background:#fbbf24;color:#1e293b">다시 도전</button>
  </section>

</div>

const $ = s => document.querySelector(s);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function buildQuiz(){
  // 필수 5문제 (섞어서)
  const must = shuffle(MUST.map(q => ({t:q[0],a:q[1]}))).slice(0,MUST_N);
  // 세트당 하나씩 골고루: 세트 순서를 섞고 라운드로빈으로 15개 채움
  const order = shuffle(SETS.map((_,i)=>i));
  const pool = SETS.map(s => shuffle(s.slice()));
  const picked = [];
  let r = 0;
  while(picked.length < PICK){
    const set = pool[order[picked.length % order.length]];
    // 같은 세트에서 라운드마다 다른 문제 뽑기
    const q = set[r];
    if(q){ picked.push({t:q[0],a:q[1]}); }
    if((picked.length % order.length) === 0) r++;
  }
  quiz = must.concat(picked);
}

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $('#'+id).classList.add('active'); }

// 핸드폰번호 자동 하이픈
function fmtPhone(v){
  const d = v.replace(/\D/g,'').slice(0,11);
  if(d.length<4) return d;
  if(d.length<7) return d.slice(0,3)+'-'+d.slice(3);
  if(d.length<11) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
}

  if(name.length < 2) return bad('f-name','성명을 2자 이상 정확히 입력해 주세요.');
  if(school.length < 2) return bad('f-school','학교명을 정확히 입력해 주세요.');
  if(!/^[1-3]$/.test(grade)) return bad('f-grade','학년은 1~3 사이 숫자로 입력해 주세요.');
  if(!/^([1-9]|[1-9][0-9])$/.test(cls)) return bad('f-class','반은 숫자로 입력해 주세요.');
  const phoneDigits = phone.replace(/\D/g,'');
  if(!/^010[0-9]{8}$/.test(phoneDigits)) return bad('f-phone','올바른 핸드폰번호를 입력해 주세요. (010-0000-0000 형식)');
  if(!$('#f-consent').checked){ alert('개인정보 수집 및 이용에 동의해야 참여할 수 있습니다.'); return; }

  student = {name, school, grade, cls, phone:fmtPhone(phone), consent:'agree'};
  startQuiz();
}

// 구글시트로 전송 (Apps Script). no-cors + text/plain 으로 프리플라이트 회피
function submitToSheet(){
  if(!SHEET_URL || !student) return;
  const data = {...student, score:score, total:TOTAL, ts:new Date().toLocaleString('ko-KR')};
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).catch(()=>{});
}

function startQuiz(){
  buildQuiz(); idx = 0; score = 0;
  show('quiz');
  // 타이머: CSS transition으로 막대 줄이기
  const bar = $('#timebar');
  bar.style.transition='none'; bar.style.width='100%';
  void bar.offsetWidth; // reflow
  bar.style.transition='width '+LIMIT+'s linear';
  bar.style.width='0%';
  endAt = Date.now() + LIMIT*1000;
  clearInterval(tick);
  tick = setInterval(()=>{
    const left = Math.max(0, Math.ceil((endAt - Date.now())/1000));
    $('#time').textContent = '⏱ '+left+'초';
    if(left<=0){ finish(); }
  }, 200);
  $('#time').textContent='⏱ '+LIMIT+'초';
  render();
}

function render(){
  const q = quiz[idx];
  const must = idx < MUST_N;
  $('#progress').textContent = (idx+1)+' / '+TOTAL;
  $('#badge').textContent = must ? '필수문제 '+(idx+1) : '문제 '+(idx+1);
  $('#badge').className = 'badge'+(must?' must':'');
  $('#qtext').textContent = q.t;
  const ans = $('#answers');
  ans.classList.remove('locked');
  ans.querySelectorAll('.ans').forEach(b=>{
    b.classList.remove('correct','wrong');
    const m = b.querySelector('.mark'); if(m) m.remove();
  });
}

function answer(v){
  const ans = $('#answers');
  if(ans.classList.contains('locked')) return;
  ans.classList.add('locked');
  const correct = (v==='O') === quiz[idx].a;
  if(correct) score++;
  // 선택한 버튼엔 정/오 표시, 틀렸으면 정답 버튼도 함께 표시
  const picked = ans.querySelector('.ans[data-v="'+v+'"]');
  const answerBtn = ans.querySelector('.ans[data-v="'+(quiz[idx].a?'O':'X')+'"]');
  picked.classList.add(correct?'correct':'wrong');
  picked.insertAdjacentHTML('beforeend','<span class="mark">'+(correct?'✓':'✗')+'</span>');
  if(!correct){ answerBtn.classList.add('correct'); answerBtn.insertAdjacentHTML('beforeend','<span class="mark">✓</span>'); }
  setTimeout(()=>{
    idx++;
    if(idx>=TOTAL || Date.now()>=endAt){ finish(); }
    else render();
  }, 1200);
}

function finish(){
  clearInterval(tick);
  submitToSheet();
  show('result');
  $('#score').textContent = score+' / '+TOTAL;
  let msg;
  if(score===TOTAL) msg='완벽해요! 진정한 평경코인 부자! 🪙';
  else if(score>=15) msg='훌륭해요! 예비 경제인 인증! 👍';
  else if(score>=10) msg='좋아요! 조금만 더 공부하면 부자!';
  else msg='괜찮아요, 다시 도전해서 평경코인을 모아요!';
  $('#resultMsg').textContent = msg;
}

// ── 이벤트 ───────────────────────────────────────────
$('#f-phone').addEventListener('input', e=>{ e.target.value = fmtPhone(e.target.value); });
$('#startBtn').addEventListener('click', ()=>show('info'));
$('#infoBtn').addEventListener('click', beginQuiz);
$('#retryBtn').addEventListener('click', ()=>show('info'));
document.querySelectorAll('.ans').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.v)));
</script>
</body>
</html>
